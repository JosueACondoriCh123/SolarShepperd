name: solarshepherd

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: solarshepherd
      POSTGRES_USER: solarshepherd
      POSTGRES_PASSWORD: solarshepherd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarshepherd -d solarshepherd"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - operational-data:/data/operational

  worker:
    build:
      context: ./backend
    env_file: .env
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--beat", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - operational-data:/data/operational

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_AUTH_MODE: ${AUTH_MODE:-development}
      VITE_SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      CI: "true"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  operational-data:
